<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Sign up - Ingenio</title>
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../login/login.css">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <header class="topbar">
            <a href="../hero/hero.html" class="logo">
                <img src="../images/ingenio-logo-white.png" alt="Ingenio" width="1290" height="410">
            </a>
            <a href="../hero/hero.html" class="tbtn"><i data-lucide="arrow-left"></i> Back to home</a>
        </header>
        <main class="panel">
            <section class="auth" id="signupView">
                <h1 class="auth__title">Create your account</h1>
                <p class="auth__sub">It's free!</p>
                <form class="form" id="signupForm" novalidate>
                    <p class="form-alert" id="formAlert" role="alert"><i data-lucide="circle-alert"></i><span></span></p>
                    <div class="field" id="emailField">
                        <div class="field__top">
                            <label class="label" for="email">Email</label>
                        </div>
                        <input class="input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
                        <p class="error"><i data-lucide="circle-alert"></i><span></span></p>
                    </div>
                    <div class="field" id="passwordField">
                        <div class="field__top">
                            <label class="label" for="password"></label>
                        </div>
                        <div class="input-wrap">
                            <input class="input input--pw" id="password" name="password" placeholder="Create a password" autocomplete="new-password">
                            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                                <i data-lucide="eye" class="icon-show"></i>
                                <i data-lucide="eye-off" class="icon-hide"></i>
                            </button>
                        </div>
                        <p class="hint">At least 8 characters.</p>
                        <p class="error"><i data-lucide="circle-alert"></i><span></span></p>
                    </div>
                    <button type="submit" class="btn btn--solid submit" id="submitBtn">
                        <span class="label-text">Create account</span>
                        <i data-lucide="loader-circle" class="spinner"></i>
                    </button>
                </form>
                <p class="auth__foot">Already have an account? <a href="../login/login.html">Log in</a></p>
            </section>
            <section class="auth sent" id="sentView" hidden>
                <div class="sent__icon"><i data-lucide="mail"></i></div>
                <h1 class="auth_title">Check your email</h1>
                <p class="auth__sub">We've sent a link to <strong id="sentEmail"></strong>. Click it to confirm your account and continue setting up.</p>
                <button type="button" class="btn btn--soft" id="resendBtn">Resend email</button>
                <p class="auth__foot">Wrong email? <a href="#" id="changeEmail">Use a different one</a></p>
            </section>
        </main>

        <script src="../shared/supabase.js"></script>
        <script src="signup.js"></script>
    </body>
</html>
