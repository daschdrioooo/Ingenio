<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Ingenio - Login</title>
        <link rel="icon" type="image/png" href="../images/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../login/login.css">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <header class="topbar">
            <a href="../hero/hero.html" class="logo">
                <img src="../images/ingenio-logo-black.png" alt="Ingenio" width="1290" height="410">
            </a>
            <a href="../hero/hero.html" class="tbtn"><i data-lucide="arrow-left"></i> Back to home</a>
        </header>
        <div class="doodles" aria-hidden="true">
                <span style="--x:6%;--y:68%;--s:88px;--r:12deg"><i data-lucide="sigma"></i></span>
                <span style="--x:42%;--y:9%;--s:54px;--r:14deg"><i data-lucide="pi"></i></span>
                <span style="--x:90%;--y:13%;--s:70px;--r:-8deg"><i data-lucide="radical"></i></span>
                <span style="--x:70%;--y:74%;--s:104px;--r:10deg"><i data-lucide="infinity"></i></span>
                <span style="--x:29%;--y:64%;--s:46px;--r:-18deg"><i data-lucide="divide"></i></span>
                <span style="--x:95%;--y:48%;--s:50px;--r:20deg"><i data-lucide="percent"></i></span>
                <span style="--x:57%;--y:82%;--s:76px;--r:-6deg"><i data-lucide="calculator"></i></span>
                <span style="--x:15%;--y:88%;--s:62px;--r:24deg"><i data-lucide="ruler"></i></span>
                <span style="--x:84%;--y:86%;--s:68px;--r:-14deg"><i data-lucide="triangle-right"></i></span>
                <span style="--x:3%;--y:22%;--s:42px;--r:12deg"><i data-lucide="equal"></i></span>
                <span style="--x:39%;--y:92%;--s:56px;--r:8deg;"><i data-lucide="chart-spline"></i></span>
                <span style="--x:52%;--y:46%;--s:34px;--r:20deg"><i data-lucide="x"></i></span>
                <span style="--x:66%;--y:12%;--s:32px;--r:0deg"><i data-lucide="plus"></i></span>
        </div>
        <main class="panel">
            <section class="auth">
                <h1 class="auth__title">Welcome back</h1>
                <p class="auth__sub">Log in to pick up where you left off</p>
                <form class="form" id="loginForm" novalidate>
                    <p class="form-alert" id="formAlert" role="alert"><i data-lucide="circle-alert"></i><span></span></p>
                    <div class="field" id="emailField">
                        <div class="field__top">
                            <label class="label" for="email">Email</label>
                        </div>
                        <input class="input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
                        <p class="error"><i data-lucide="circle-alert"></i><span></span></p>
                    </div>
                    <div class="field" id="passwordField">
                        <div class="field__top">
                            <label class="label" for="password">Password</label>
                            <a href="#forgot" class="link">Forgot password?</a>
                        </div>
                        <div class="input-wrap">
                            <input class="input input--pw" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                                <i data-lucide="eye" class="icon-show"></i>
                                <i data-lucide="eye-off" class="icon-hide"></i>
                            </button>
                        </div>
                        <p class="error"><i data-lucide="circle-alert"></i><span></span></p>
                    </div>
                    <button type="submit" class="btn btn--solid submit" id="submitBtn">
                        <span class="label-text">Log in</span>
                        <i data-lucide="loader-circle" class="spinner"></i>
                    </button>
                </form>
                <p class="auth__foot">New to Ingenio? <a href="../signup/signup.html">Create a new account</a></p>
            </section>
        </main>

        <script src="../shared/supabase.js"></script>
        <script src="login.js"></script>
    </body>
</html>
