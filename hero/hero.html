<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Ingenio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet"/>
        <link rel="stylesheet" href="hero.css">
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    <body>
        <header class="topbar" id="topbar">
            <div class="topbar__inner">
                <a href="#" class="logo">
                    <img class="logo__img" src="../images/ingenio-logo-black.png" width="1290" height="410">
                </a>
                <ul class="nav">
                    <li><a href="#features">Features</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#pricing">Pricing</a></li>
                </ul>
                <div class="actions">
                    <div class="country" id="country">
                        <button class="country__btn" id="countryBtn">
                            <img class="flag" src="https://flagcdn.com/gb.svg" width="21" height="14">
                            <span>UK</span>
                            <i data-lucide="chevron-down" class="chevron"></i>
                        </button>
                        <ul class="country__menu" role="menu">
                            <li>
                                <button class="country__option" role="menuitem">
                                    <img class="flag" src="https://flagcdn.com/gb.svg" width="21" height="14">
                                    United Kingdom
                                    <i data-lucide="check" class="tick"></i>
                                </button>
                            </li>
                            <li class="country__soon">wip</li>
                        </ul>
                    </div>
                    <a href="#login" class="btn btn--outline">Log in</a>
                    <a href="#signup" class="btn btn--solid">Sign up</a>
                </div>
                <button class="menu-toggle" id="menuToggle">
                    <i data-lucide="menu" class="icon-open"></i>
                    <i data-lucide="x" class="icon-close"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="hero-bg">
                <section class="hero">
                    <h1 class="hero__title"><span>Ace your maths exams</span><span>for completely free</span></h1>
                    <p class="hero__sub">this is what you need to become intelligent my g. fru8ntwoiurntcowiuenroiucwneoriunx</p>
                    <a href="signup" class="btn btn--solid btn--lg hero__cta">Sign up for free <i data-lucide="arrow-right"></i></a>
                </section>
            </div>
        </main>

        <script src="hero.js"></script>
    </body>
</html>
