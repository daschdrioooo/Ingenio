<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
        <link href="home.css" rel="stylesheet">
    </head>

    <body>
        <div id="sideBar">
            <div id="nav">
            <header>
            <img id="logo" src="ingenio-logo-black.png" width="100" height="auto">
            </header>
            <div></div>
            <ul>
                <li data-panel="lessons">Lessons</li>
                <li data-panel="practice-papers">Practice papers</li>
                <li data-panel="practice-questions">Practice questions</li>
                <li data-panel="ai-tutor">Ai Tutor</li>
            </ul>
            <footer>
                    <div id="userFoot">
                        <div class="avatar">
                            <i id="avatar" data-lucide="user"></i>
                        </div>
                        <div style="padding: 8px; margin-top: 8px;">user</div>
                    </div>
                    <div id="settings">
                        <i id="cog" data-lucide="settings"></i>
                    </div>
            </footer>
            </div>
            <div class="panel" id="lessons">lessons stuff</div>
            <div class="panel" id="practice-papers">practice papers stuff</div>
            <div class="panel" id="practice-questions">practice questions stuff</div>
            <div class="panel" id="ai-tutor">ai tutor stuff</div>

            <div class="background" id="lessonsBackground"></div>
            <div class="background" id="practice-papersBackground"></div>
            <div class="background" id="practice-questionsBackground"></div>
            <div class="background" id="ai-tutorBackground"></div>
        </div>
        <script src="home.js"></script>
    </body>
</html>
