<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Dashboard - Ingenio</title>
        <link rel="preconnect" rel="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="home.css">
    </head>
    <body class="checking">
        <div class="app">
            <aside class="side">
                <a href="#" class="side__logo">
                    <img src="../images/ingenio-logo-white.png" alt="Ingenio" width="1920" height="410">
                </a>
                <ul class="nav" id="nav">
                    <li><a href="#" class="active" data-page="home"><i data-lucide="house"></i> Home</a></li>
                    <li><a href="#" data-page="lessons"><i data-lucide="book-open"></i> Lessons</a></li>
                    <li><a href="#" data-page="papers"><i data-lucide="file-text"></i> Practice papers</a></li>
                    <li><a href="#" data-page="questions"><i data-lucide="pencil-line"></i> Practice questions</a></li>
                    <li><a href="#" data-page="tutor"><i data-lucide="message-circle"></i> AI tutor</a></li>
                </ul>
            </aside>
            <header class="topbar">
                <div class="drop" id="boardDrop">
                    <button type="button" class="drop__btn" aria-haspopup="menu" aria-expanded="false"> <!-- trying accessibility feats through aria because if we want to release this fr we should have it -->
                        <span><span class="board__level" id="boardLevel"><span id="boardName"></span></span>
                        <i data-lucide="chevron-down"></i>
                    </button>
                    <div class="menu" hidden>
                        <button type="button" class="menu__item" data-board="Edexcel">Edexcel <i data-lucide="check" class="tick"></i></button>
                        <button type="button" class="menu__item" data-board="AQA">AQA <i data-lucide="check" class="tick"></i></button>
                        <button type="button" class="menu__item" data-board="OCR">OCR <i data-lucide="check" class="tick"></i></button>
                    </div>
                </div>
                <label class="search">
                    <i data-lucide="search"></i>
                    <input type="search" id="search" placeholder="Search topics and lessons" autocomplete="off">
                </label>
                <div class="drop account" id="accountDrop">
                    <button type="button" class="drop__btn" aria-haspopup="menu" aria-expanded="false">
                        <span class="avatar" id="avatar"></span>
                        <span id="accountName"></span>
                        <i data-lucide="chevron-down"></i>
                    </button>
                    <div class="menu menu--right" hidden>
                        <div class="menu__head">
                            <span class="menu__name" id="menuName"></span>
                            <span class="menu__sub" id="menuEmail"></span>
                        </div>
                        <button type="button" class="menu__item"><i data-lucide="settings"></i> Settings</button>
                        <button type="button" class="menu__item menu__item--danger" id="logOutBtn"><i data-lucide="log-out"></i></button>
                    </div>
                </div>
            </header>
            <main class="panel" id="panel"></main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../shared/supabase.js"></script>
        <script src="home.js"></script>
    </body>
</html>
